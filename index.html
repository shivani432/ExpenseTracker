<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
   
</head>

<body>
    

<div id="expenseContainer">

    <h1>Expense Tracker</h1>

    <button id="logoutBtn">Logout</button>

    <input type="text" id="expenseName" placeholder="Enter expense">

    <input type="number" id="expenseAmount" placeholder="Enter amount">

 <!-- Transaction Type -->
<select id="transactionType">

    <option value="Expense">Expense</option>

    <option value="Income">Income</option>

</select>   


<select id="expenseCategory">

    <option value="Food">Food</option>

    <option value="Travel">Travel</option>

    <option value="Shopping">Shopping</option>

    <option value="Bills">Bills</option>

    <option value="Salary">Salary</option>

    <option value="Other">Other</option>

</select>

<input type="date" id="expenseDate">

<button id="addBtn">Add Transaction</button>
<button id="exportBtn">📥 Export CSV</button>

<div class="dashboard">

    <div class="card">
        <h3>💰 Income</h3>
        <h2>₹<span id="totalIncome">0</span></h2>
    </div>

    <div class="card">
        <h3>💸 Expense</h3>
        <h2>₹<span id="totalExpense">0</span></h2>
    </div>

    <div class="card">
        <h3>🏦 Balance</h3>
        <h2>₹<span id="balance">0</span></h2>
    </div>

    <div class="card">
        <h3>📋 Transactions</h3>
        <h2><span id="transactionCount">0</span></h2>
    </div>

    <div class="card">
        <h3>📊 Showing</h3>
        <h2><span id="showingCount">0</span></h2>
    </div>

</div>

    <!-- Search Expense -->
<input type="text" id="searchExpense" placeholder="Search Expense">
<select id="filterCategory">

    <option value="All">All Categories</option>

    <option value="Food">Food</option>

    <option value="Travel">Travel</option>

    <option value="Shopping">Shopping</option>

    <option value="Bills">Bills</option>

    <option value="Salary">Salary</option>

    <option value="Other">Other</option>

</select>
<select id="filterType">

    <option value="All">All</option>

    <option value="Income">Income</option>

    <option value="Expense">Expense</option>

</select>

<h3>Total: ₹<span id="total">0</span></h3>

<ul id="expenseList"></ul>

<!-- Expense Chart -->
<canvas id="expenseChart"></canvas>

</div>

    

    <!-- Chart.js Library -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="script.js"></script>

</body>
</html>
